[package]
name = "qaqh-napi-smoke"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json = "1"
qaqh-client = { path = "E:/qaqh-backend/crates/qaqh-client" }
qaqh-ringing = { path = "E:/qaqh-backend/crates/qaqh-ringing" }
